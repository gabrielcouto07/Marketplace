    <text x="297" y="152" text-anchor="middle" font-size="14" fill="#5d6b80">Autoridade tributária do Paraguai · situação fiscal da empresa</text>
    <text x="40" y="210" font-size="12" fill="#5d6b80">RAZÃO SOCIAL</text>
