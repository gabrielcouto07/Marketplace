    <text x="320" y="276" font-size="12" fill="#5d6b80">SITUAÇÃO</text>
    <text x="320" y="300" font-size="18" font-weight="700">EM DIA</text>
    <text x="40" y="342" font-size="12" fill="#5d6b80">EMISSÃO</text>
    <text x="40" y="366" font-size="16">00/00/0000</text>
