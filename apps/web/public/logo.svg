<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Marketplace Paraguai — sacola sobre azul com faixa tricolor</title>
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="166"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- quadrado azul da marca -->
    <rect width="512" height="512" fill="#0038A8"/>
    <!-- círculo decorativo, como no hero do app -->
    <circle cx="420" cy="80" r="160" fill="#FFFFFF" opacity="0.08"/>
    <!-- sacola (traço branco) -->
    <g transform="translate(96 82) scale(13.333)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
      <path d="M3 6h18"/>
      <path d="M16 10a4 4 0 0 1-8 0"/>
    </g>
    <!-- faixa tricolor no pé -->
    <rect x="0" y="460" width="170.67" height="52" fill="#D52B1E"/>
    <rect x="170.67" y="460" width="170.67" height="52" fill="#FFFFFF"/>
    <rect x="341.33" y="460" width="170.67" height="52" fill="#4E7BD9"/>
  </g>
</svg>
